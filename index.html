    <div style="text-align:center;margin:8px 0"><svg class="mascot" viewBox="0 0 200 172" role="img" aria-label="サラダのキャラクター"><ellipse cx="100" cy="164" rx="58" ry="7" style="fill:var(--chip)"/><circle cx="46" cy="80" r="23" fill="#8fd16a"/><circle cx="154" cy="80" r="23" fill="#8fd16a"/><circle cx="72" cy="58" r="27" fill="#a6dd7e"/><circle cx="130" cy="56" r="28" fill="#a6dd7e"/><circle cx="100" cy="46" r="24" fill="#c4eb9a"/><circle cx="100" cy="80" r="26" fill="#8fd16a"/><path d="M52 76q8-12 18-9M108 34q10 2 14 14M138 84q6-9 15-7M88 72q8 4 5 14M30 72q3-6 9-8" fill="none" stroke="#6fb24f" stroke-width="3" stroke-linecap="round" opacity=".55"/><circle cx="62" cy="52" r="10" fill="#ff6b57"/><path d="M56 47q5-3 10 0" fill="none" stroke="#ffd2c8" stroke-width="2.5" stroke-linecap="round"/><circle cx="130" cy="48" r="11" fill="#e4f6b8" stroke="#7cc45a" stroke-width="3"/><circle cx="126" cy="46" r="1.8" fill="#7cc45a"/><circle cx="134" cy="48" r="1.8" fill="#7cc45a"/><circle cx="130" cy="54" r="1.8" fill="#7cc45a"/><circle cx="97" cy="30" r="7" fill="#ffa63d"/><circle cx="97" cy="30" r="2.8" fill="#ffd08a"/><circle cx="150" cy="70" r="4.5" fill="#ffe45e"/><circle cx="42" cy="86" r="4.5" fill="#ffe45e"/><circle cx="76" cy="84" r="4" fill="#ffe45e"/><path d="M28 94h144c0 36-30 62-72 62s-72-26-72-62z" fill="#ffe9cf"/><rect x="22" y="90" width="156" height="12" rx="6" style="fill:var(--o)"/><circle cx="82" cy="120" r="5" fill="#4a2c17"/><circle cx="118" cy="120" r="5" fill="#4a2c17"/><path d="M94 128q6 6 12 0" fill="none" stroke="#4a2c17" stroke-width="3" stroke-linecap="round"/><ellipse cx="68" cy="130" rx="8" ry="5" fill="#ff9d8f" opacity=".7"/><ellipse cx="132" cy="130" rx="8" ry="5" fill="#ff9d8f" opacity=".7"/><path d="M174 22l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" style="fill:var(--o)"/><path d="M20 44l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" style="fill:var(--o)"/></svg></div><button class="btn" onclick="go('nu')">はじめる</button>
    <p class="tip">① 栄養素を選ぶ → ② シーンを選ぶ → ③ 料理を提案</p>`;
  }else if(s.scr=="nu"){
    h=head("栄養素を選択","意識して摂りたい栄養素を選んでください（複数OK）","home")+`<div class="grid g3">${N.map(n=>`<button class="tile ${s.nu.includes(n[0])?"on":""}" onclick="tg(s.nu,'${n[0]}')"><span class="e">${n[2]}</span>${n[1]}</button>`).join("")}</div>
    <p class="tip">選択中：${s.nu.map(u=>NM[u]).join("・")||"なし"}</p><button class="btn" ${s.nu.length?"":"disabled"} onclick="go('sc')">次へ</button>`;
  }else if(s.scr=="sc"){
    h=head("食べるシーン","あなたの状況に合わせて提案します","nu")+`<div class="grid g2">${SC.map(c=>`<button class="tile ${s.sc==c[0]?"on":""}" style="padding:20px 4px" onclick="s.sc='${c[0]}';render()"><span class="e">${c[2]}</span>${c[1]}</button>`).join("")}</div>
    <p class="tip" style="text-align:left">その他の希望（任意）</p><div class="chips">${WI.map(w=>`<button class="tile ${s.wi.includes(w[0])?"on":""}" onclick="tg(s.wi,'${w[0]}')">${w[1]}</button>`).join("")}</div>
    <p class="tip" style="text-align:left">控えたいもの（任意）</p><div class="chips">${LM.map(l=>`<button class="tile ${s.lim.includes(l[0])?"on":""}" onclick="tg(s.lim,'${l[0]}');sv('lim',s.lim)">${l[2]} ${l[1]}</button>`).join("")}</div>
    <p class="tip" style="text-align:left;margin-top:8px">※ 塩分控えめは味付けが薄くなりやすい料理の目安です。カロリー控えめは約350kcal以下。</p>
    <button class="btn" onclick="suggest()">この条件で提案する</button>`;
  }else if(s.scr=="res"){
    const d=s.list[s.i];
    h=head("料理の提案","選んだ栄養素を含む料理です","sc");
    if(!d)h=h+`<div class="card">条件に合う料理が見つかりませんでした。<br>栄養素やシーンを変えてみてください。</div>`;
    else h+=`<div class="card"><button class="heart" onclick="fav('${d.n}')">${s.fav.includes(d.n)?"❤️":"🤍"}</button><div class="big">${d.e}</div><h2 style="font-size:21px">${d.n}</h2>
    <div>${d.u.map(u=>`<span class="chip" ${s.nu.includes(u)?'style="background:var(--o);color:#fff"':""}>${NM[u]}</span>`).join("")}</div>
    <div class="meta"><span>⏱ ${d.m?"約"+d.m+"分":"調理なし"}</span><span>🔥 約${d.k}kcal</span><span>${[...d.s].map(c=>SC.find(x=>x[0]==c)[1]).join("・")}</span></div></div>
    <div class="row"><button class="btn ghost" onclick="s.i=(s.i+1)%s.list.length;render()">別の料理を見る</button><button class="btn" onclick="decide(s.list[s.i])">これにする！</button></div>
    <p class="tip">${s.list.length>1?(s.i+1)+" / "+s.list.length+" 件":""}</p>`;
  }else if(s.scr=="his"){
    h=lh("履歴","タップでもう一度見られます",s.his.length)+(s.his.map((x,i)=>lr(i,`${byName(x.n).e} ${x.n}`,`<span class="sub" style="margin:0">${x.t}</span>`,`pick(byName('${x.n}'))`)).join("")||`<p class="sub">まだ履歴がありません</p>`)+lb(s.his.length);
  }else if(s.scr=="fav"){
    h=lh("お気に入り","❤️ をつけた料理が並びます",s.fav.length)+(s.fav.map((n,i)=>lr(i,`${byName(n).e} ${n}`,`<span>❤️</span>`,`pick(byName('${n}'))`)).join("")||`<p class="sub">まだありません</p>`)+lb(s.fav.length);
  }else if(s.scr=="how"){
    const st=["アプリを開く","「はじめる」をタップ","補いたい栄養素を選ぶ（複数OK）","自炊・コンビニ・外食などのシーンを選ぶ。控えたいもの（塩分・カロリー）も選べます","おすすめの料理が表示されます。「別の料理を見る」で他の候補、「これにする！」で履歴に保存"];
    h=`<h2>使い方</h2><p class="sub">はじめての方はこちら</p><div class="box">${st.map((x,i)=>`<div class="step"><b>${i+1}</b><span>${x}</span></div>`).join("")}</div><div class="box" style="margin-top:14px"><div class="step"><span>✓ 栄養素を選ぶだけで、料理を提案<br>✓ ❤️ でお気に入り、履歴から見返せる<br>✓ 苦手な食材は「設定」で除外できる</span></div></div>`;
  }else{
    h=`<h2>設定</h2><p class="sub">好みに合わせて調整できます</p><div class="box"><h2>苦手な食材を除外</h2><p class="sub" style="text-align:left;margin:0 0 4px">選択した食材を使った料理は、提案に出てこなくなります。</p>${EX.map(x=>`<button class="srow" onclick="s.free=$('#fr').value;tg(s.ex,'${x[0]}');sv('ex',s.ex)"><span class="g">${x[1]}を除く</span><span class="sw ${s.ex.includes(x[0])?"on":""}"></span></button>`).join("")}<div class="lab">その他（自由入力）</div><input class="ti" id="fr" value="${esc(s.free)}" placeholder="例：セロリ、ラム肉 など"><p class="tip" style="text-align:left;margin-top:6px">※料理名に含まれる言葉で除外します（カンマ区切り）</p></div><button class="btn" onclick="saveSet()">保存する</button>`;
  }
  $("#app").innerHTML=h;
  const m=s.scr=="nu"||s.scr=="sc"||s.scr=="res"?"home":s.scr;
  $("#nav").innerHTML=[["home","🏠","ホーム"],["his","🕘","履歴"],["fav","❤️","お気に入り"],["set","⚙️","設定"],["how","ⓘ","使い方"]].map(n=>`<button class="${m==n[0]?"on":""}" onclick="go('${n[0]}')"><b>${n[1]}</b>${n[2]}</button>`).join("");
}
render();
</script></body></html>
